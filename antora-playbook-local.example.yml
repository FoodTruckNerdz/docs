site:
  title: FoodTruckNerdz Documentation
  url: https://docs.foodtrucknerdz.com
  start_page: docs::index.adoc
  keys:
    site_description: "Food Truck Nerdz documentation (multi-component Antora site)"
    github_profile_url: "https://github.com/FoodTruckNerdz"
    foodtrucknerdz_com: "https://foodtrucknerdz.com"
    ui_bundle_name: "antora-dark-theme"
    ui_bundle_url: "https://github.com/antora-supplemental/antora-dark-theme"
content:
  sources:
    - url: ../onboarding
      branches: HEAD
      start_path: docs
    - url: ../food-truck-api
      branches: HEAD
      start_path: docs
    - url: ../ftn-site
      branches: HEAD
      start_path: docs
    - url: ../ftn-site-old
      branches: HEAD
      start_path: docs
    - url: .
      branches: HEAD
      start_path: docs
    - url: ../help
      branches: HEAD
      start_path: docs
    - url: ../developer-portal
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/antora-dark-theme/releases/latest/download/ui-bundle.zip
    snapshot: true
  supplemental_files: ./site/supplemental-ui
asciidoc:
  extensions:
    - asciidoctor-emoji
  attributes:
    # Organization URLs
    github-org: FoodTruckNerdz
    github-org-url: https://github.com/FoodTruckNerdz
    docs-site-url: https://docs.foodtrucknerdz.com
    # Repository names
    repo-docs: docs
    repo-ftn-site: ftn-site
    repo-food-truck-api: food-truck-api
    repo-onboarding: onboarding
    repo-help: help
    repo-developer-portal: developer-portal
    repo-ftn-site-old: ftn-site-old
