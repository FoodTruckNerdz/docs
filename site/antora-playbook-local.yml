site:
  title: FoodTruckNerdz Documentation
  url: https://docs.foodtrucknerdz.com
  start_page: docs::index.adoc
content:
  sources:
    - url: ../../onboarding
      branches: HEAD
      start_path: docs
    - url: ../../food-truck-api
      branches: HEAD
      start_path: docs
    - url: ../../ftn-site
      branches: HEAD
      start_path: docs
    - url: ../../ftn-site-old
      branches: HEAD
      start_path: docs
    - url: ..
      branches: HEAD
      start_path: docs
    - url: ../../help
      branches: HEAD
      start_path: docs
    - url: ../../developer-portal
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/the-dev-center/antora-dark-theme/releases/latest/download/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
asciidoc:
  extensions:
    - asciidoctor-emoji
  attributes:
    # Organization URLs
    github-org: FoodTruckNerds
    github-org-url: https://github.com/FoodTruckNerds
    docs-site-url: https://docs.foodtrucknerdz.com
    # Repository names
    repo-docs: docs
    repo-ftn-site: ftn-site
    repo-food-truck-api: food-truck-api
    repo-onboarding: onboarding
    repo-help: help
    repo-developer-portal: developer-portal
    repo-ftn-site-old: ftn-site-old
