name: Build and Deploy Documentation

on:
  # Every commit on every branch, plus PRs. The links job gates build and deploy.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Fast first job: sparse checkout of .adoc and attribute files, no pnpm install.
  # A failing scan stops the Antora build and Pages deploy from starting.
  links:
    uses: antora-supplemental/link-registry/.github/workflows/check.yml@v0

  build:
    needs: links
    strategy:
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Omit version: use package.json "packageManager" only (pnpm/action-setup rejects both)
          package_json_file: package.json

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mermaid browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Build Antora site
        env:
          # Antora requires git credentials to be stored in GIT_CREDENTIALS environment variable
          # When Antora tries to access a private GitHub repository, it has to make a call to
          # using the standard URL format:
          #   https://<username>:<password>@github.com
          # and GitHub specifies using "x-access-token" as the username. For the password,
          # we use the Personal Access Token (PAT) saved into the repository's Secrets manager on
          # GitHub. In this case, secrets.FTN_GITHUB_TOKEN
          GIT_CREDENTIALS: "https://x-access-token:${{ secrets.FTN_GITHUB_TOKEN }}@github.com"
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
