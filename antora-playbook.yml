site:
  title: FoodTruckNerdz Documentation
  url: https://docs.foodtrucknerdz.com
  start_page: docs::index.adoc
content:
  sources:
    - url: https://github.com/FoodTruckNerdz/onboarding.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/food-truck-api.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/ftn-site.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/ftn-site-old.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/docs-site.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/help.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/developer-portal.git
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/the-dev-center/antora-dark-theme/releases/latest/download/ui-bundle.zip
    snapshot: true
  supplemental_files: ./site/supplemental-ui
asciidoc:
  extensions:
    - asciidoctor-emoji
  attributes:
    # Organization URLs
    github-org: FoodTruckNerdz
    github-org-url: https://github.com/FoodTruckNerdz
    docs-site-url: https://docs.foodtrucknerdz.com
    # Repository names
    repo-docs: docs-site
    repo-ftn-site: ftn-site
    repo-food-truck-api: food-truck-api
    repo-onboarding: onboarding
    repo-help: help
    repo-developer-portal: developer-portal
    repo-ftn-site-old: ftn-site-old
