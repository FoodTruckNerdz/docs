site:
  title: FTN Docs
  url: https://docs.foodtrucknerdz.com
  start_page: docs::index.adoc
  keys:
    site_description: "Multi-component Antora site (unified project documentation)"
    github_profile_url: "https://github.com/FoodTruckNerdz"
    # Valentus 2.x branding keys (no forked header partial required).
    header_logo: foodtrucknerdz.svg
    header_logo_tone: brand
    site_home_url: "https://foodtrucknerdz.com"
    site_home_label: "foodtrucknerdz.com"
    header_doc_title: "FTN Docs"
    # Shown in footer; match ui.bundle in this file (becomes site.keys.uiBundle* in the UI model).
    ui_bundle_name: "valentus-theme"
    ui_bundle_url: "https://github.com/antora-supplemental/valentus-theme"
    # Browser tab (head-title partial): last segment; middle = each component’s antora.yml `title` (e.g. ftn-site uses "Docs").
    title_bar_brand: "FTN Docs"
content:
  sources:
    - url: https://github.com/FoodTruckNerdz/onboarding.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/food-truck-api.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/ftn-site.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/ftn-app.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/docs.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/help.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/developer-portal.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/FoodTruckNerdz/infra.git
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./site/supplemental-ui
asciidoc:
  extensions:
    - asciidoctor-emoji
  attributes:
    stem: latexmath
    # Organization URLs
    github-org: FoodTruckNerdz
    github-org-url: https://github.com/FoodTruckNerdz
    docs-site-url: https://docs.foodtrucknerdz.com
    # Repository names
    repo-docs: docs
    repo-ftn-site: ftn-site
    repo-ftn-app: ftn-app
    repo-food-truck-api: food-truck-api
    repo-onboarding: onboarding
    repo-help: help
    repo-developer-portal: developer-portal
    repo-infra: infra
antora:
  extensions:
    - '@antora/lunr-extension'
    # Bare /component/ → version chooser (selector). Unversioned (version: ~)
    # components are skipped. short_circuit_single: false so even a single
    # numbered version gets a chooser page instead of aliasing straight through.
    - require: '@antora-supplemental/unversioned-component-urls'
      mode: selector
      short_circuit_single: false
    - '@antora-supplemental/build-stack'
